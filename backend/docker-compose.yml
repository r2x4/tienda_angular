services:
  db:
    image: postgres:16-alpine
    container_name: tienda_angular_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tienda_angular}
      POSTGRES_USER: ${POSTGRES_USER:-tienda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tienda_user} -d ${POSTGRES_DB:-tienda_angular}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - tienda_backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tienda_angular_api
    restart: unless-stopped
    env_file:
      - .env.example
    environment:
      APP_NAME: ${APP_NAME:-tienda-angular-backend}
      APP_ENV: ${APP_ENV:-development}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tienda_angular}
      POSTGRES_USER: ${POSTGRES_USER:-tienda_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-tienda_user}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-tienda_angular}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - tienda_backend

volumes:
  postgres_data:

networks:
  tienda_backend:
    driver: bridge

