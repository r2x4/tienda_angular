<div class="container mx-auto px-4 flex-grow">
  <main class="py-8 max-w-4xl mx-auto">
    <a routerLink="/servicios" class="text-blue-600 hover:underline">&larr; Volver a servicios</a>

    <div *ngIf="loading()" class="text-center py-8 text-gray-600">Cargando servicio...</div>
    <div *ngIf="!loading() && error()" class="text-center py-8 text-red-600">
      <p>{{ error() }}</p>
      <button type="button" (click)="load()" class="mt-3 px-4 py-2 bg-blue-500 text-white rounded">Reintentar</button>
    </div>
    <div *ngIf="!loading() && !error() && notFound()" class="text-center py-8 text-gray-600">Servicio no disponible o inexistente.</div>

    <div *ngIf="!loading() && !error() && service() as svc" class="bg-white rounded-lg shadow-md overflow-hidden mt-4">
      <div class="h-72 overflow-hidden bg-gray-100">
        <img [src]="svc.image_url || 'assets/ropa_ropaDeportiva.jpg'" [alt]="svc.name" [title]="svc.name" class="w-full h-full object-cover">
      </div>
      <div class="p-6">
        <h2 class="text-2xl font-bold mb-2">{{ svc.name }}</h2>
        <p *ngIf="svc.description" class="text-gray-700 mb-4">{{ svc.description }}</p>
        <p class="text-xl font-bold text-gray-800">{{ formatCop(svc.price_cop) }}</p>
        <p *ngIf="svc.duration_minutes !== null" class="text-sm text-gray-500 mt-2">Duración: {{ svc.duration_minutes }} min</p>
      </div>
    </div>
  </main>
</div>
