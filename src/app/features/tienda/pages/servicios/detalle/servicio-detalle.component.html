<div class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-10">
  <a routerLink="/servicios" class="inline-flex items-center gap-2 text-teal-700 font-semibold hover:text-teal-800 min-h-11"><i class="fas fa-arrow-left" aria-hidden="true"></i> Volver a servicios</a>

  <div *ngIf="loading()" class="mt-6 bg-white rounded-2xl border border-line-200 overflow-hidden"><div class="aspect-[16/7] skeleton"></div><div class="p-6 space-y-4"><div class="h-8 skeleton w-2/3"></div><div class="h-4 skeleton"></div><div class="h-4 skeleton w-5/6"></div></div></div>

  <div *ngIf="!loading() && error()" class="mt-6 bg-white border border-red-200 rounded-2xl p-8 text-center">
    <p class="text-danger-600 font-medium">{{ error() }}</p>
    <button type="button" (click)="load()" class="mt-4 min-h-11 px-5 rounded-xl bg-ink-900 text-white font-semibold">Reintentar</button>
  </div>

  <div *ngIf="!loading() && !error() && notFound()" class="mt-6 bg-white border border-line-200 rounded-2xl p-10 text-center">
    <h2 class="font-display text-2xl font-bold text-ink-900">Servicio no disponible</h2>
    <p class="text-ink-600 mt-2">El servicio no existe o no está activo actualmente.</p>
    <a routerLink="/servicios" class="inline-flex mt-5 min-h-11 px-5 rounded-xl bg-ink-900 text-white font-semibold items-center">Ver servicios</a>
  </div>

  <article *ngIf="!loading() && !error() && service() as svc" class="mt-6 bg-white rounded-3xl border border-line-200 shadow-sm overflow-hidden">
    <div class="aspect-[16/7] bg-sand-50 overflow-hidden border-b border-line-200">
      <img [src]="svc.image_url || 'assets/images/public/service-training.jpg'" [alt]="svc.name" [title]="svc.name" class="w-full h-full object-cover">
    </div>
    <div class="p-6 sm:p-8">
      <p class="text-sm font-semibold text-teal-700 uppercase tracking-wide">Detalle de servicio</p>
      <h1 class="font-display text-3xl sm:text-4xl font-bold text-ink-900 mt-2">{{ svc.name }}</h1>
      <div class="flex flex-wrap gap-3 mt-5">
        <span class="inline-flex items-center px-4 py-2 rounded-xl bg-sand-50 border border-line-200 text-ink-900 font-bold">{{ formatCop(svc.price_cop) }}</span>
        <span *ngIf="svc.duration_minutes !== null" class="inline-flex items-center px-4 py-2 rounded-xl bg-sand-50 border border-line-200 text-ink-600 font-medium">Duración: {{ svc.duration_minutes }} min</span>
      </div>
      <p *ngIf="svc.description" class="text-ink-600 mt-6 leading-7 whitespace-pre-line">{{ svc.description }}</p>
    </div>
  </article>
</div>
