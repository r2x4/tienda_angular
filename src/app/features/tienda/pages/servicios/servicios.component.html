<div class="container mx-auto px-4 flex-grow">
  <main class="py-8">
    <h2 class="text-2xl font-bold mb-6">Servicios</h2>

    <div *ngIf="loading()" class="text-center py-8 text-gray-600">Cargando servicios...</div>
    <div *ngIf="!loading() && error()" class="text-center py-8 text-red-600">
      <p>{{ error() }}</p>
      <button type="button" (click)="load()" class="mt-3 px-4 py-2 bg-blue-500 text-white rounded">Reintentar</button>
    </div>
    <div *ngIf="!loading() && !error() && services().length === 0" class="text-center py-8 text-gray-600">No hay servicios disponibles.</div>

    <div *ngIf="!loading() && !error() && services().length > 0" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
      <div *ngFor="let service of services()" class="bg-white rounded-lg shadow-md overflow-hidden transition-all duration-300 hover:shadow-lg hover:scale-105">
        <div class="h-56 overflow-hidden bg-gray-100">
          <img [src]="service.image_url || 'assets/ropa_ropaDeportiva.jpg'" [alt]="service.name" [title]="service.name" class="w-full h-full object-cover">
        </div>
        <div class="p-4">
          <h3 class="font-bold text-lg mb-2">{{ service.name }}</h3>
          <p *ngIf="service.description" class="text-gray-600 text-sm mb-2">{{ service.description }}</p>
          <p class="text-gray-700 font-bold">{{ formatCop(service.price_cop) }}</p>
          <p *ngIf="service.duration_minutes !== null" class="text-sm text-gray-500 mt-1">Duración: {{ service.duration_minutes }} min</p>
          <a [routerLink]="['/servicios', service.id]" class="mt-4 inline-block w-full text-center bg-blue-500 text-white py-2 rounded-md hover:bg-blue-600 transition-colors duration-300">Ver detalle</a>
        </div>
      </div>
    </div>
  </main>
</div>
