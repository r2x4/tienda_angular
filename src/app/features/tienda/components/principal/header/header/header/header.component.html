<header class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-line-200">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-18 items-center justify-between gap-3 py-3">
      <a routerLink="/inicial" class="flex items-center gap-3 rounded-lg focus-visible:outline-none" aria-label="Ir al inicio de La tienda">
        <span class="inline-flex h-11 w-11 items-center justify-center rounded-xl bg-sand-50 border border-line-200 text-teal-700">
          <i class="fas fa-bag-shopping" aria-hidden="true"></i>
        </span>
        <span>
          <span class="block font-display text-xl sm:text-2xl font-bold text-ink-900 leading-none">La tienda</span>
          <span class="block text-xs text-ink-600 mt-1">Claridad que invita a comprar</span>
        </span>
      </a>

      <nav class="hidden lg:flex items-center gap-7" aria-label="Navegación principal">
        <a *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="is-active"
           [routerLinkActiveOptions]="{ exact: !!item.exact }" class="nav-link text-sm xl:text-base">{{ item.label }}</a>
      </nav>

      <div class="flex items-center gap-1 sm:gap-2">
        <a routerLink="/cart" class="icon-btn relative" aria-label="Carrito de compras">
          <i class="fas fa-shopping-cart text-lg" aria-hidden="true"></i>
          <span *ngIf="cartItemCount() > 0" class="absolute top-1 right-1 min-w-5 h-5 px-1 rounded-full bg-teal-600 text-white text-[11px] font-bold flex items-center justify-center">{{ cartItemCount() }}</span>
        </a>
        <button type="button" class="icon-btn hidden sm:inline-flex gap-2 px-3 w-auto" (click)="openAuthModal()" [attr.aria-label]="accountLabel()">
          <i class="fas fa-user text-lg" aria-hidden="true"></i>
          <span class="text-sm font-semibold max-w-28 truncate">{{ accountLabel() }}</span>
        </button>
        <button #menuButton type="button" class="icon-btn lg:hidden" (click)="openMobile()" [attr.aria-expanded]="mobileOpen()" aria-controls="mobile-menu" aria-label="Abrir menú">
          <i class="fas fa-bars text-lg" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="mobileOpen()" class="fixed inset-0 z-[60] lg:hidden" aria-hidden="false">
    <div class="absolute inset-0 bg-ink-900/45" (click)="closeMobile()"></div>
    <aside #drawerPanel id="mobile-menu" role="dialog" aria-modal="true" aria-label="Menú de navegación" tabindex="-1"
      class="drawer absolute right-0 top-0 h-full w-[min(22rem,100vw)] bg-white shadow-2xl border-l border-line-200 p-5 flex flex-col">
      <div class="flex items-center justify-between mb-6">
        <span class="font-display text-2xl font-bold text-ink-900">La tienda</span>
        <button type="button" class="icon-btn" (click)="closeMobile()" aria-label="Cerrar menú"><i class="fas fa-times text-lg" aria-hidden="true"></i></button>
      </div>
      <nav class="flex flex-col gap-1" aria-label="Navegación móvil">
        <a *ngFor="let item of navItems" [routerLink]="item.route" routerLinkActive="bg-sand-50 text-teal-700"
           [routerLinkActiveOptions]="{ exact: !!item.exact }" (click)="onNavClick()"
           class="px-3 py-3 rounded-xl text-base font-semibold text-ink-900 hover:bg-sand-50 min-h-11 flex items-center">{{ item.label }}</a>
      </nav>
      <div class="mt-auto pt-6 border-t border-line-200 flex flex-col gap-2">
        <button type="button" class="w-full min-h-11 px-4 rounded-xl border border-line-200 text-ink-900 font-semibold hover:bg-sand-50" (click)="openAuthModal()">
          <i class="fas fa-user mr-2" aria-hidden="true"></i>{{ accountLabel() }}
        </button>
        <a routerLink="/cart" (click)="onNavClick()" class="w-full min-h-11 px-4 rounded-xl bg-ink-900 text-white font-semibold flex items-center justify-center">
          <i class="fas fa-shopping-cart mr-2" aria-hidden="true"></i>Ver carrito ({{ cartItemCount() }})
        </a>
      </div>
    </aside>
  </div>
</header>

<app-user-auth-modal *ngIf="isAuthModalOpen()" (closeModal)="closeAuthModal()"></app-user-auth-modal>
