<article class="group bg-white rounded-2xl border border-line-200 shadow-sm overflow-hidden transition-all duration-300 hover:shadow-lg hover:-translate-y-0.5 flex flex-col h-full">
  <a [routerLink]="detailRoute" class="block aspect-[4/3] bg-sand-50 overflow-hidden border-b border-line-200" [attr.aria-label]="'Ver detalle de ' + product().name">
    <img [src]="product().imageUrl" [alt]="product().name" [title]="product().name" loading="lazy"
         class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-[1.03]" />
  </a>

  <div class="p-4 sm:p-5 flex flex-col flex-1">
    <div class="flex items-start justify-between gap-3 mb-2">
      <a [routerLink]="detailRoute" class="font-display text-lg font-semibold text-ink-900 leading-snug hover:text-teal-700 transition-colors">{{ product().name }}</a>
      <span class="shrink-0 inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold"
            [ngClass]="available ? 'bg-emerald-50 text-success-600' : 'bg-red-50 text-danger-600'">{{ stockLabel }}</span>
    </div>

    <p *ngIf="product().description" class="text-sm text-ink-600 line-clamp-2 mb-3">{{ product().description }}</p>
    <p class="text-xl font-bold text-ink-900">{{ formatCop(product().price_cop || product().price) }}</p>

    <div *ngIf="(product().colors?.length ?? 0) > 0" class="mt-4">
      <p class="text-xs font-semibold text-ink-600 mb-2">Color <span *ngIf="product().selectedColor">: {{ product().selectedColor }}</span></p>
      <div class="flex flex-wrap gap-2">
        <button *ngFor="let color of product().colors" type="button" (click)="selectColor(color)"
                class="w-8 h-8 rounded-full border-2 min-w-8 min-h-8"
                [ngClass]="[colorClass(color), product().selectedColor === color ? 'border-teal-600 ring-2 ring-teal-600/20 scale-105' : 'border-line-200']"
                [attr.aria-label]="'Seleccionar color ' + color" [attr.aria-pressed]="product().selectedColor === color"></button>
      </div>
    </div>

    <div class="mt-auto pt-4 space-y-2">
      <p *ngIf="feedback()" class="text-xs rounded-lg px-3 py-2"
         [ngClass]="feedback()?.type === 'success' ? 'bg-emerald-50 text-success-600' : 'bg-red-50 text-danger-600'"
         [attr.role]="feedback()?.type === 'error' ? 'alert' : 'status'">{{ feedback()?.text }}</p>
      <button type="button" (click)="addToCart()" [disabled]="!available || adding()"
              class="w-full min-h-11 rounded-xl bg-ink-900 text-white font-semibold hover:bg-black/90 disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        <i class="fas fa-shopping-cart mr-2" aria-hidden="true"></i>
        {{ adding() ? 'Añadiendo...' : (available ? 'Añadir al carrito' : 'No disponible') }}
      </button>
    </div>
  </div>
</article>
