<div class="login-container">
  <h2>Acceso de Administrador</h2>
  <form (ngSubmit)="login()">
    <div class="form-group">
      <label for="username">Usuario / Email:</label>
      <input type="text" id="username" name="username" [ngModel]="username()" (ngModelChange)="username.set($event)" placeholder="admin o admin@example.com" required>
    </div>
    <div class="form-group">
      <label for="password">Contraseña:</label>
      <input type="password" id="password" name="password" [ngModel]="password()" (ngModelChange)="password.set($event)" placeholder="Password" required>
    </div>
    <button type="submit" [disabled]="loading()">{{ loading() ? 'Ingresando...' : 'Ingresar' }}</button>
    <p *ngIf="errorMessage()" class="error-message">{{ errorMessage() }}</p>
  </form>
</div>
